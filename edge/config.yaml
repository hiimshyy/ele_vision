# Smart Cabin Platform - Edge Configuration
# Override any value with environment variable: SC_{SECTION}_{KEY}
# Example: SC_CAMERA_URL=rtsp://192.168.1.100:554/stream

# --- Camera / RTSP Stream ---
camera:
  url: "rtsp://192.168.1.100:554/stream1"
  capture_fps: 25          # Native camera FPS
  process_fps: 10          # FPS sent to plugins (lower = less CPU)
  reconnect_interval: 5.0  # Seconds between reconnect attempts
  max_reconnect_attempts: 10  # 0 = infinite retries
  connection_timeout: 10.0   # Seconds to wait for camera connection

# --- MQTT Communication ---
mqtt:
  broker_host: "localhost"
  broker_port: 1883
  username: ""
  password: ""
  device_id: "cabin-001"
  keepalive: 60

# --- Plugins ---
plugins:
  directory: "edge/plugins"
  modules:
    - name: "face_recognition"
      enabled: true
      config:
        detection_threshold: 0.7
        recognition_threshold: 0.6
        embedding_model: "w600k_mbf.onnx"
        embedding_threshold: 0.4
        min_face_size: 80
        min_face_quality: 50.0
        cooldown_seconds: 30
        database_path: "data/db/faces.db"
        # Tracker settings
        tracker_iou_threshold: 0.4
        tracker_max_lost: 15        # 3s at 5fps
        tracker_max_tracks: 10
        tracker_reverify_interval: 15  # re-verify every 3s at 5fps
        # Auto-snapshot (save face crops on detection)
        snapshot_enabled: false
        snapshot_dir: "data/snapshots"
        snapshot_max_per_person_per_day: 10
        snapshot_save_full_frame: true

    - name: "dummy"
      enabled: false
      config:
        log_interval: 10

    # Future plugins (disabled by default)
    # - name: "people_counter"
    #   enabled: false
    #   config:
    #     max_capacity: 10

    # - name: "elevator_control"
    #   enabled: false
    #   config:
    #     default_floor: 1

# --- Logging ---
logging:
  level: "INFO"               # DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  file: ""                    # Empty = stdout only, or path like "logs/cabin.log"
