# Smart Cabin - Mosquitto MQTT Broker Configuration
# Place this at /etc/mosquitto/mosquitto.conf or include it

# --- Listener ---
listener 1883
protocol mqtt

# --- Authentication ---
# For development: allow anonymous
allow_anonymous true

# For production: use password file
# password_file /etc/mosquitto/passwd
# allow_anonymous false

# --- Persistence ---
persistence true
persistence_location /var/lib/mosquitto/

# --- Logging ---
log_dest file /var/log/mosquitto/mosquitto.log
log_type all
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# --- Limits ---
max_connections 50
max_queued_messages 1000
message_size_limit 262144

# --- WebSocket (optional, for web dashboard) ---
# listener 9001
# protocol websockets
