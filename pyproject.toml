[project]
name = "smart-cabin"
version = "0.1.0"
description = "Smart Cabin Platform for Elevator - Face Recognition & Beyond"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["edge/tests", "cloud/tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["edge*", "cloud*", "shared*"]
